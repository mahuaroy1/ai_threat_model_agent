[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-threat-model-agent"
version = "0.1.0"
description = "Static threat modeling for LangChain and LangGraph applications, with optional local Ollama narratives."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - All rights reserved" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ai-threat-model = "ai_threat_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
